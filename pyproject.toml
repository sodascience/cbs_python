[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# PyG CPU wheels (built for torch 2.8) come from the PyG flat (find-links)
# index, not PyPI. Persisted here so every uv add/lock/sync/export can find
# them without a --find-links flag.
[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
format = "flat"
explicit = true

# Route the five PyG binary packages to that index (explicit = true means it's
# used ONLY for these, never for general PyPI resolution).
[tool.uv.sources]
pyg-lib = { index = "pyg-cpu" }
torch-scatter = { index = "pyg-cpu" }
torch-sparse = { index = "pyg-cpu" }
torch-cluster = { index = "pyg-cpu" }
torch-spline-conv = { index = "pyg-cpu" }
