    "igraph==1.0.0",
    "imbalanced-learn==0.14.2",
    "inspect-ai==0.3.241",
    "interpret==0.7.8",
    "ipython==9.15.0",
    "jax==0.10.2",
    "json5==0.15.0",
    "jupysql==0.11.1",
    "jupyter==1.1.1",
    "jupyterlab==4.6.0",
    "jupyterlab-optuna==0.3.0",
    "kaleido==1.3.0",
